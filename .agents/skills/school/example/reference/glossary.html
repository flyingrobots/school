<h1>Glossary</h1>
<dl>
  <dt>Bit</dt><dd>One binary digit, 0 or 1.</dd>
  <dt>Place value</dt><dd>What a digit is worth because of where it stands. In binary each place is worth twice the place to its right: 1, 2, 4, 8, 16.</dd>
  <dt>Carry</dt><dd>When a place's sum reaches 2, write 0 and add 1 to the next place to the left.</dd>
</dl>
