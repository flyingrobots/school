# Runs School in Docker behind `tailscale serve` (ADR 4). Nothing here names a course (ADR 6):
# the course, the learner's state and any source material come from the environment, usually
# a gitignored server/.env beside this file. See compose.example.env.
services:
  school:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4747:4747"   # local only; tailscale serve publishes it to the tailnet
    environment:
      # Host names School answers to besides localhost, comma-separated: the tailnet name that
      # `tailscale serve` publishes it under. Any other Host header is refused (DNS rebinding).
      SCHOOL_ALLOWED_HOSTS: ${SCHOOL_ALLOWED_HOSTS:-}
      # Read-only source material the course cites, as name=path pairs inside the container.
      SCHOOL_MOUNTS: ${SCHOOL_MOUNTS:-}
      # Explanation grading through the bridge on the host (bridge/bridge.ts). Optional: without
      # SCHOOL_BRIDGE_URL, explanations are saved but not graded.
      SCHOOL_BRIDGE_URL: ${SCHOOL_BRIDGE_URL:-}
      SCHOOL_BRIDGE_TOKEN: ${SCHOOL_BRIDGE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the bridge runs on the host, outside Docker
    volumes:
      - ../assets:/framework/assets:ro   # the framework supplies assets and nothing else
      - ${SCHOOL_COURSE_DIR:?set SCHOOL_COURSE_DIR to the course repository}:/course:ro
      - ${SCHOOL_STATE_DIR:?set SCHOOL_STATE_DIR to the private learner-state directory}:/state
      - ${SCHOOL_SOURCES_DIR:?set SCHOOL_SOURCES_DIR to the course's source material, or to an empty directory}:/sources:ro
