# Runs School in Docker behind `tailscale serve` (ADR 4). Nothing here names a course (ADR 6):
# the course, the learner's state and any source material come from the environment, usually
# a gitignored server/.env beside this file. See compose.example.env.
#
# Start it with `./school up` from the checkout (host/school.ts), not `docker compose up`
# (flyingrobots/school#123). The three secrets live in the macOS Keychain; the launcher reads them
# and runs compose with them in compose's environment only. Compose copies each one into the
# services that need it as a file under /run/secrets/ (top-level `secrets:` below), and each
# service's environment names only that file's path, so no secret is in server/.env, in argv or in
# `docker inspect`. Run without the launcher, compose stops: `environment variable
# "SCHOOL_POSTGRES_PASSWORD" required by secret ... is not set`. docs/topics/secrets/README.md.
#
# The learner's record is in Postgres (RFC 3), in the named volume `postgres`. `docker compose down`
# keeps it; `docker compose down -v` deletes it, and with it every answer, and the backups beside it
# in the named volume `backups` (the `backup` service).
#
# Only the one-shot `migrate` job and the `backup` service hold the superuser's password
# (flyingrobots/school#91). `migrate` applies the migrations as the owner, makes school_app a login
# with SCHOOL_APP_PASSWORD, and exits; `school` starts only once `migrate` has exited 0 and logs in
# as school_app. The server refuses to start on a login that fails its login check
# (docs/topics/architecture/README.md, "The login check"). Never grant school_app anything by hand.
services:
  postgres:
    # Pinned by tag and digest: the major version is the record's on-disk format.
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    restart: unless-stopped
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: postgres
      # The image's entrypoint reads it, as root, before it starts the server as `postgres`.
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - { source: postgres_password, mode: 0o400 }
    volumes:
      - postgres:/var/lib/postgresql   # Postgres 18's image keeps its data under here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=school"]
      interval: 2s
      timeout: 5s
      retries: 30
    # No ports: only the migrate job, the backup service and the school service reach it, on the
    # compose network.
  migrate:
    # The server's image, running server/migrate.ts instead of the server. Each `docker compose up`
    # runs it again; with nothing pending it applies nothing and exits 0.
    build: .
    # Built from this checkout on every `docker compose up` (layers cached), so a pulled update
    # never runs beside an old image: docs/workflows/upgrade/README.md.
    pull_policy: build
    command: ["bun", "migrate.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The owner's URL: the superuser, which creates the roles and runs each file as school_owner.
      # Its password is the file below, which the job puts into the URL (server/secrets.ts).
      SCHOOL_MIGRATE_URL: postgres://postgres@postgres:5432/school
      SCHOOL_MIGRATE_PASSWORD_FILE: /run/secrets/postgres_password
      # school_app's password, which the job sets (as a SCRAM verifier) and the server logs in with.
      SCHOOL_APP_PASSWORD_FILE: /run/secrets/app_password
    secrets:
      # Read by the image's user, `school` (uid 1000, server/Dockerfile), and no one else.
      - { source: postgres_password, uid: "1000", gid: "1000", mode: 0o400 }
      - { source: app_password, uid: "1000", gid: "1000", mode: 0o400 }
  backup:
    # A custom-format pg_dump of the record every SCHOOL_BACKUP_INTERVAL_SECONDS (default six hours),
    # keeping the newest SCHOOL_BACKUP_KEEP (default 28, a week) in the named volume `backups`
    # (backup/backup.sh). The same image as the database, so pg_dump matches its major version.
    # Restoring: docs/workflows/backup-and-restore/README.md.
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: school
      # backup.sh reads it into its own environment, as root, for pg_dump.
      PGPASSWORD_FILE: /run/secrets/postgres_password
      SCHOOL_BACKUP_INTERVAL_SECONDS: ${SCHOOL_BACKUP_INTERVAL_SECONDS:-21600}
      SCHOOL_BACKUP_KEEP: ${SCHOOL_BACKUP_KEEP:-28}
    secrets:
      - { source: postgres_password, mode: 0o400 }
    volumes:
      - ./backup/backup.sh:/backup/backup.sh:ro
      # Its published output schemas, which --help and --schema print (flyingrobots/school#135).
      - ./backup/schemas:/backup/schemas:ro
      - backups:/backups
    # No ports: it only connects out, to the postgres service.
  school:
    build: .
    pull_policy: build   # as for migrate: never an old image beside a new migrate job
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4747:4747"   # local only; tailscale serve publishes it to the tailnet
    environment:
      # The record, as school_app, which the migrations grant EXECUTE on School's functions; the
      # server runs its login check before it serves (server/adapters/database.ts). Its password is
      # the file below, which the server puts into the URL. No superuser password reaches here.
      SCHOOL_DATABASE_URL: postgres://school_app@postgres:5432/school
      SCHOOL_DATABASE_PASSWORD_FILE: /run/secrets/app_password
      # Host names School answers to besides localhost, comma-separated: the tailnet name that
      # `tailscale serve` publishes it under. Any other Host header is refused (DNS rebinding).
      SCHOOL_ALLOWED_HOSTS: ${SCHOOL_ALLOWED_HOSTS:-}
      # Read-only source material the course cites, as name=path pairs inside the container.
      SCHOOL_MOUNTS: ${SCHOOL_MOUNTS:-}
      # More courses, at paths under /library, beside the one at /course: `bells=/library`, or
      # `a=/library/a,b=/library/b` for a folder of courses (flyingrobots/school#156). Optional.
      SCHOOL_COURSES: ${SCHOOL_COURSES:-}
      # Courses served in safe mode, the same name=path pairs (`guest=/library/guest`): their files
      # are sandboxed, so they cannot run script as School (flyingrobots/school#210). Optional.
      SCHOOL_UNTRUSTED_COURSES: ${SCHOOL_UNTRUSTED_COURSES:-}
      # The course store (RFC 7 §5.1), in the named volume `course-store`: the folder installed
      # courses will live in, and nothing else; nothing installs into it yet. Set SCHOOL_COURSE_STORE
      # empty in .env for no store, which keeps installing off. It may not be, hold or sit inside a
      # course, the state folder, a mount or the web app: the server refuses to start (exit 2).
      SCHOOL_COURSE_STORE: ${SCHOOL_COURSE_STORE-/store}
      # The course at /course, named after that folder (`course`). Set SCHOOL_COMPOSE_COURSE empty in
      # .env to name that course in SCHOOL_COURSES instead (`aion=/course,bells=/library`), after
      # renaming it in the record (docs/topics/migrate-job, "Renaming a course"). Its own variable,
      # so a SCHOOL_COURSE exported for running the server on the host never reaches the container.
      SCHOOL_COURSE: ${SCHOOL_COMPOSE_COURSE-/course}
      # Explanation grading through the bridge on the host (bridge/bridge.ts). Optional: without
      # SCHOOL_BRIDGE_URL, explanations are saved but not graded. The token is the one the bridge
      # reads from the same Keychain item.
      SCHOOL_BRIDGE_URL: ${SCHOOL_BRIDGE_URL:-}
      SCHOOL_BRIDGE_TOKEN_FILE: /run/secrets/bridge_token
    secrets:
      - { source: app_password, uid: "1000", gid: "1000", mode: 0o400 }
      - { source: bridge_token, uid: "1000", gid: "1000", mode: 0o400 }
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the bridge runs on the host, outside Docker
    volumes:
      - ../assets:/framework/assets:ro   # the framework supplies its assets and its built web app
      - ../web/dist:/framework/web/dist:ro   # build it first: `npm run build` in web/
      - ${SCHOOL_COURSE_DIR:?set SCHOOL_COURSE_DIR to the course repository}:/course:ro
      - ${SCHOOL_STATE_DIR:?set SCHOOL_STATE_DIR to the private learner-state directory}:/state
      - ${SCHOOL_SOURCES_DIR:?set SCHOOL_SOURCES_DIR to the course's source material, or to an empty directory}:/sources:ro
      # Optional: the folder SCHOOL_COURSES reads from. Without it, the course folder again, which nothing reads there.
      - ${SCHOOL_LIBRARY_DIR:-${SCHOOL_COURSE_DIR}}:/library:ro
      - course-store:/store   # see SCHOOL_COURSE_STORE above
# Each from the launcher's environment (host/school.ts), which read it from the Keychain. Compose
# copies each into the services that list it, at /run/secrets/<name>.
secrets:
  postgres_password:
    environment: SCHOOL_POSTGRES_PASSWORD
  app_password:
    environment: SCHOOL_APP_PASSWORD
  bridge_token:
    environment: SCHOOL_BRIDGE_TOKEN
volumes:
  postgres:
  # The dumps. `docker compose down -v` deletes this volume too, with the record: copy a dump
  # elsewhere first (docs/workflows/backup-and-restore/README.md).
  backups:
  # The course store (SCHOOL_COURSE_STORE): course content, never learner state, which stays in
  # the `postgres` volume and SCHOOL_STATE_DIR.
  course-store:
