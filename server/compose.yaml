# Runs School in Docker behind `tailscale serve` (ADR 4). Nothing here names a course (ADR 6):
# the course, the learner's state and any source material come from the environment, usually
# a gitignored server/.env beside this file. See compose.example.env.
#
# The learner's record is in Postgres (RFC 3), in the named volume `postgres`. `docker compose down`
# keeps it; `docker compose down -v` deletes it, and with it every answer, and the backups beside it
# in the named volume `backups` (the `backup` service).
#
# Only the one-shot `migrate` job and the `backup` service hold the superuser's password
# (flyingrobots/school#91). `migrate` applies the migrations as the owner, makes school_app a login
# with SCHOOL_APP_PASSWORD, and exits; `school` starts only once `migrate` has exited 0 and logs in
# as school_app. The server refuses to start on a login that fails its login check
# (docs/topics/architecture/README.md, "The login check"). Never grant school_app anything by hand.
services:
  postgres:
    # Pinned by tag and digest: the major version is the record's on-disk format.
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    restart: unless-stopped
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCHOOL_POSTGRES_PASSWORD:?set SCHOOL_POSTGRES_PASSWORD to a long random secret}
    volumes:
      - postgres:/var/lib/postgresql   # Postgres 18's image keeps its data under here
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=postgres --dbname=school"]
      interval: 2s
      timeout: 5s
      retries: 30
    # No ports: only the migrate job, the backup service and the school service reach it, on the
    # compose network.
  migrate:
    # The server's image, running server/migrate.ts instead of the server. Each `docker compose up`
    # runs it again; with nothing pending it applies nothing and exits 0.
    build: .
    # Built from this checkout on every `docker compose up` (layers cached), so a pulled update
    # never runs beside an old image: docs/workflows/upgrade/README.md.
    pull_policy: build
    command: ["bun", "migrate.ts"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The owner's URL: the superuser, which creates the roles and runs each file as school_owner.
      SCHOOL_MIGRATE_URL: postgres://postgres:${SCHOOL_POSTGRES_PASSWORD}@postgres:5432/school
      # school_app's password, which the job sets (as a SCRAM verifier) and the server logs in with.
      SCHOOL_APP_PASSWORD: ${SCHOOL_APP_PASSWORD:?set SCHOOL_APP_PASSWORD to a long random secret of letters and digits}
  backup:
    # A custom-format pg_dump of the record every SCHOOL_BACKUP_INTERVAL_SECONDS (default six hours),
    # keeping the newest SCHOOL_BACKUP_KEEP (default 28, a week) in the named volume `backups`
    # (backup/backup.sh). The same image as the database, so pg_dump matches its major version.
    # Restoring: docs/workflows/backup-and-restore/README.md.
    image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: school
      PGPASSWORD: ${SCHOOL_POSTGRES_PASSWORD:?set SCHOOL_POSTGRES_PASSWORD to a long random secret}
      SCHOOL_BACKUP_INTERVAL_SECONDS: ${SCHOOL_BACKUP_INTERVAL_SECONDS:-21600}
      SCHOOL_BACKUP_KEEP: ${SCHOOL_BACKUP_KEEP:-28}
    volumes:
      - ./backup/backup.sh:/backup/backup.sh:ro
      # Its published output schemas, which --help and --schema print (flyingrobots/school#135).
      - ./backup/schemas:/backup/schemas:ro
      - backups:/backups
    # No ports: it only connects out, to the postgres service.
  school:
    build: .
    pull_policy: build   # as for migrate: never an old image beside a new migrate job
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4747:4747"   # local only; tailscale serve publishes it to the tailnet
    environment:
      # The record, as school_app, which the migrations grant EXECUTE on School's functions; the
      # server runs its login check before it serves (server/adapters/database.ts). No superuser
      # password reaches here.
      SCHOOL_DATABASE_URL: postgres://school_app:${SCHOOL_APP_PASSWORD}@postgres:5432/school
      # Host names School answers to besides localhost, comma-separated: the tailnet name that
      # `tailscale serve` publishes it under. Any other Host header is refused (DNS rebinding).
      SCHOOL_ALLOWED_HOSTS: ${SCHOOL_ALLOWED_HOSTS:-}
      # Read-only source material the course cites, as name=path pairs inside the container.
      SCHOOL_MOUNTS: ${SCHOOL_MOUNTS:-}
      # Explanation grading through the bridge on the host (bridge/bridge.ts). Optional: without
      # SCHOOL_BRIDGE_URL, explanations are saved but not graded.
      SCHOOL_BRIDGE_URL: ${SCHOOL_BRIDGE_URL:-}
      SCHOOL_BRIDGE_TOKEN: ${SCHOOL_BRIDGE_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the bridge runs on the host, outside Docker
    volumes:
      - ../assets:/framework/assets:ro   # the framework supplies assets and nothing else
      - ${SCHOOL_COURSE_DIR:?set SCHOOL_COURSE_DIR to the course repository}:/course:ro
      - ${SCHOOL_STATE_DIR:?set SCHOOL_STATE_DIR to the private learner-state directory}:/state
      - ${SCHOOL_SOURCES_DIR:?set SCHOOL_SOURCES_DIR to the course's source material, or to an empty directory}:/sources:ro
volumes:
  postgres:
  # The dumps. `docker compose down -v` deletes this volume too, with the record: copy a dump
  # elsewhere first (docs/workflows/backup-and-restore/README.md).
  backups:
