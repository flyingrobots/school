name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bunx tsc -p server
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # web/test drives the app in Chrome (preinstalled on the runner) through playwright-core.
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: bun test
