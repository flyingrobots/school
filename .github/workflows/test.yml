name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres (RFC 3 §2, flyingrobots/school#23): the whole LearningRecord contract and the
    # learner-history story run on it through the Bun.SQL driver, beside the Bun.SQL driver's own
    # tests (server/adapters/bunsql.test.ts, server/contract/learner-history.test.ts); the same cases
    # run on PGlite in the same `bun test`. Each test gets a database of its own on this server
    # (server/testing/postgres.ts). The same image, by digest, as server/compose.yaml.
    services:
      postgres:
        image: postgres:18.7@sha256:eb63372c1e05c755f55fa30cbd07aecc443676fc6c0fa90b9002d01537841e1a
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      SCHOOL_TEST_POSTGRES_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bunx tsc -p server
      # The host processes, the launcher (`./school`) and the vault it and the bridge read secrets
      # through (flyingrobots/school#123). CI has no Keychain: its tests use a fake vault, and
      # everything else keeps plain environment variables.
      - run: bun install --frozen-lockfile
        working-directory: host
      - run: bunx tsc -p host
      # The web tests render components (web/test/quiz.test.tsx) and drive the app in Chrome,
      # preinstalled on the runner, through playwright-core (web/test/shell.test.ts); both need web's packages.
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      # The JUnit report feeds the gate below; the console output is unchanged.
      - run: bun test --reporter=junit --reporter-outfile=${{ runner.temp }}/junit.xml
      # Those tests skip without SCHOOL_TEST_POSTGRES_URL, and a skip passes. This fails the build
      # unless every Bun.SQL test ran and passed and every PGlite contract or story case also ran
      # on Bun.SQL.
      - run: bun run server/testing/postgres-gate.ts ${{ runner.temp }}/junit.xml
