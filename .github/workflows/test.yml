name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bunx tsc -p server
      # The web tests render components (web/test/quiz.test.tsx), so they need web's packages.
      - run: npm ci
        working-directory: web
      - run: npx tsc -b
        working-directory: web
      - run: bun test
